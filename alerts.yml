groups:
  - name: monitoring.rules
    rules:
      - alert: PrometheusDown
        expr: up{job="prometheus"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus is down"
          description: "Prometheus has not been reachable for more than 2 minutes."

      - alert: NodeExporterDown
        expr: up{job=~"local-node|remote-server-.*"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Node Exporter target is down"
          description: "A node exporter target has stopped reporting metrics for more than 2 minutes."

      - alert: HighCpuUsage
        expr: 100 * (1 - avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m]))) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is above 90% for more than 5 minutes on {{ $labels.instance }}."

      - alert: HighMemoryUsage
        expr: 100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is above 90% for more than 5 minutes on {{ $labels.instance }}."

      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space detected"
          description: "Root disk space is below 10% on {{ $labels.instance }}."
